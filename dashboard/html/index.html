<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Serveur maxime</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2d35;
    --text: #e8e8ea;
    --muted: #8a8f98;
    --accent: #5b8cff;
    --ok: #3fb950;
    --warn: #e3a008;
    --bad: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px;
    max-width: 1100px;
    margin: 0 auto;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  h1 { font-size: 1.6rem; font-weight: 600; }
  h2 { font-size: 0.8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .pill {
    font-size: 0.8rem;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
  }
  .pill.ok { color: var(--ok); }
  .pill.bad { color: var(--bad); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .big { font-size: 2.2rem; font-weight: 600; line-height: 1.1; }
  .big small { font-size: 1rem; font-weight: 400; color: var(--muted); }
  .bar { height: 8px; border-radius: 4px; background: var(--border); margin: 14px 0 8px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width 0.4s, background 0.4s; }
  svg.spark { width: 100%; height: 48px; margin-top: 10px; display: block; }
  svg.spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }

  h2.section { margin-top: 8px; }
  h2.tech-title { margin-top: 28px; }
  details.app {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    transition: border-color 0.2s;
  }
  details.app[open] { border-color: #3a3f4a; }
  details.app summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    user-select: none;
  }
  details.app summary::-webkit-details-marker { display: none; }
  details.app summary::before {
    content: "";
    width: 7px; height: 7px;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: rotate(-45deg);
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  details.app[open] summary::before { transform: rotate(45deg); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  .dot.idle { background: var(--muted); }
  .app-name { font-weight: 600; flex: 1; min-width: 0; }
  .app-url { flex-shrink: 0; text-align: right; white-space: nowrap; }
  .app-url a { color: var(--accent); font-size: 0.8rem; text-decoration: none; }
  .app-url a:hover { text-decoration: underline; }
  .app-cpu { font-size: 0.78rem; color: var(--muted); flex: 0 0 88px; width: 88px; text-align: right; font-variant-numeric: tabular-nums; }
  .app-count { font-size: 0.78rem; flex: 0 0 96px; width: 96px; text-align: right; }
  @media (max-width: 700px) { .app-url { display: none; } }
  .app-count.ok { color: var(--ok); }
  .app-count.warn { color: var(--warn); }
  .app-count.bad { color: var(--bad); }
  .app-count.idle { color: var(--muted); }
  .app-body { padding: 4px 18px 16px; border-top: 1px solid var(--border); }
  .access { margin: 12px 0 4px; }
  .access a { color: var(--accent); text-decoration: none; }
  .access a:hover { text-decoration: underline; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 8px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
  tr:last-child td { border-bottom: none; }
  .app-body td:nth-child(2), .app-body td:last-child { white-space: nowrap; }
  .app-body td:last-child, .app-body th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  td a.log { color: var(--text); text-decoration: none; border-bottom: 1px dashed var(--muted); }
  td a.log:hover { color: var(--accent); border-bottom-color: var(--accent); }
  td.desc { color: var(--muted); font-size: 0.82rem; }
  .kind { font-size: 0.72rem; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
  .kind.tunnel { color: var(--accent); border-color: var(--accent); }
  .badge { font-size: 0.75rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
  .badge.running { color: var(--ok); border-color: var(--ok); }
  .badge.exited, .badge.dead { color: var(--bad); border-color: var(--bad); }
  .badge.other { color: var(--warn); border-color: var(--warn); }
  .badge.idle { color: var(--muted); border-color: var(--border); }
  .ctl { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 12px 0 4px; }
  .ctl button { font: inherit; font-size: 0.85rem; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
  .ctl button:hover:not(:disabled) { text-decoration: underline; }
  .ctl button:disabled { opacity: 0.55; cursor: default; }
  .ctl a { color: var(--accent); font-size: 0.85rem; text-decoration: none; }
  .ctl .muted { font-size: 0.8rem; }
  .ctl .err { color: var(--bad); font-size: 0.8rem; }
</style>
</head>
<body>
<header>
  <div>
    <h1>maxime</h1>
    <p class="muted" id="sub">Raspberry Pi 4 · uptime —</p>
  </div>
  <div class="pill" id="status">Connexion…</div>
</header>

<div class="grid">
  <div class="card">
    <h2>Température CPU</h2>
    <div class="big" id="temp">—</div>
    <svg class="spark" id="temp-spark" viewBox="0 0 200 48" preserveAspectRatio="none"><polyline points=""/></svg>
    <p class="muted" id="fan" style="margin-top:8px">Ventilateur : —</p>
  </div>
  <div class="card">
    <h2>Processeur</h2>
    <div class="big" id="cpu">—</div>
    <div class="bar"><div id="cpu-bar"></div></div>
    <p class="muted" id="load">Charge : —</p>
  </div>
  <div class="card">
    <h2>Mémoire</h2>
    <div class="big" id="ram">—</div>
    <div class="bar"><div id="ram-bar"></div></div>
    <p class="muted" id="ram-detail">—</p>
  </div>
  <div class="card">
    <h2>Stockage (carte SD)</h2>
    <div class="big" id="disk">—</div>
    <div class="bar"><div id="disk-bar"></div></div>
    <p class="muted" id="disk-detail">—</p>
  </div>
</div>

<h2 class="section">Applications</h2>
<div id="apps-main"><p class="muted">Chargement…</p></div>

<h2 class="section tech-title">Outils techniques et maintenance</h2>
<div id="apps-tech"></div>

<script>
const $ = id => document.getElementById(id);
const COLORS = { ok: 'var(--ok)', warn: 'var(--warn)', bad: 'var(--bad)' };
const DOZZLE = 'https://logs.maximelabatut.com/container/';
let names = [];
let tick = 0;
let meta = {};
let logsAvailable = true;   // Dozzle (et son tunnel) en marche : les liens vers les logs sont actifs
let logsCtl = null;         // dernier état du service logs-control (null : indisponible)
let logsBusy = '';          // action en cours : '' | 'on' | 'off'
let logsMsg = '';           // message d'erreur éventuel
let openApps = new Set();
try { openApps = new Set(JSON.parse(localStorage.getItem('openApps') || '[]')); } catch (e) {}

// category: 'main' = applications, 'tech' = outils techniques et maintenance
const APPS = [
  { id: 'www', category: 'main', name: 'Site principal', url: 'https://www.maximelabatut.com', members: ['www', 'www-status', 'cloudflared-www'] },
  { id: 'gamevault', category: 'main', name: 'GameVault', url: 'https://gamevault.maximelabatut.com', members: ['gamevault', 'cloudflared-gamevault'] },
  { id: 'web2', category: 'main', name: 'Web2', url: 'https://web2.maximelabatut.com', members: ['web2', 'cloudflared-web2'] },
  { id: 'dashboard', category: 'tech', name: 'Dashboard', url: 'https://config.maximelabatut.com', members: ['dashboard', 'dashboard-sync', 'cloudflared-config'] },
  { id: 'netdata', category: 'tech', name: 'Netdata', url: 'https://netdata.maximelabatut.com', members: ['netdata', 'cloudflared-netdata'] },
  { id: 'dozzle', category: 'tech', name: 'Logs (Dozzle)', url: 'https://logs.maximelabatut.com', members: ['dozzle', 'cloudflared-logs', 'logs-control'], onDemand: true, demandMembers: ['dozzle', 'cloudflared-logs'], control: 'logs',
    note: 'Service à la demande : démarré avec le bouton ci-dessous pour lire des logs, arrêté automatiquement ensuite. Arrêté, ce tiroir est neutre et les liens vers les logs sont désactivés.' },
  { id: 'homewatch', category: 'main', name: 'Homewatch', url: 'https://homewatch.maximelabatut.com', members: ['homewatch', 'cloudflared-homewatch'] },
  { id: 'uptime', category: 'tech', name: 'Uptime Kuma', url: 'https://uptime.maximelabatut.com', members: ['uptime-kuma', 'cloudflared-uptime'] }
];

const DESCRIPTIONS = {
  'www': 'Serveur web nginx : sert le site www.maximelabatut.com',
  'www-status': 'Teste les sites toutes les 30 s et publie un statut public minimal (en ligne / hors ligne, uptime) pour la page d\'accueil',
  'cloudflared-www': 'Publie le site www sur Internet (aucun port ouvert sur la box)',
  'gamevault': 'Application GameVault (page + serveur Python, base SQLite) : gamevault.maximelabatut.com, derrière Cloudflare Access',
  'cloudflared-gamevault': 'Publie GameVault sur Internet',
  'web2': 'Serveur web nginx : sert web2.maximelabatut.com',
  'cloudflared-web2': 'Publie web2 sur Internet',
  'dashboard': 'Sert cette page et relaie l\'API de Netdata',
  'dashboard-sync': 'Génère la liste des conteneurs (nom, ID) pour les liens vers Dozzle',
  'cloudflared-config': 'Publie le dashboard (config.maximelabatut.com)',
  'cloudflared-netdata': 'Publie Netdata (netdata.maximelabatut.com)',
  'netdata': 'Collecte les métriques du Pi : température, CPU, RAM, disque, réseau, conteneurs',
  'dozzle': 'Visionneuse de logs en direct de tous les conteneurs (lecture seule, à la demande)',
  'cloudflared-logs': 'Publie Dozzle (logs.maximelabatut.com, à la demande)',
  'logs-control': 'Démarre et arrête Dozzle et son tunnel (bouton de ce tiroir) ; arrêt automatique après la durée prévue',
  'homewatch': 'Application privée (derrière Cloudflare Access + MFA)',
  'cloudflared-homewatch': 'Publie l\'application privée',
  'uptime-kuma': 'Surveille les sites toutes les minutes et envoie une alerte sur le téléphone (ntfy) en cas de panne',
  'cloudflared-uptime': 'Publie Uptime Kuma (uptime.maximelabatut.com)'
};

function kindOf(name) {
  if (name.startsWith('cloudflared-')) return ['Tunnel', 'tunnel'];
  if (name === 'dashboard-sync' || name === 'www-status' || name === 'logs-control') return ['Service', ''];
  return ['Application', ''];
}

document.addEventListener('toggle', e => {
  const d = e.target;
  if (!d.matches || !d.matches('details.app')) return;
  const id = d.getAttribute('data-id');
  if (d.open) openApps.add(id); else openApps.delete(id);
  try { localStorage.setItem('openApps', JSON.stringify([...openApps])); } catch (err) {}
}, true);

async function query(chart, params) {
  const url = '/api/v1/data?chart=' + encodeURIComponent(chart) +
    '&format=json&options=jsonwrap&' + params;
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(chart + ' ' + r.status);
  return (await r.json()).result;
}

async function latest(chart, window = 3) {
  const res = await query(chart, 'after=-' + window + '&points=1&group=average');
  const row = res.data[0];
  if (!row) throw new Error('no data ' + chart);
  const out = {};
  res.labels.forEach((label, i) => { out[label] = row[i]; });
  return out;
}

const sumValues = o => Object.entries(o).reduce((s, [k, v]) => k === 'time' ? s : s + (v || 0), 0);

function setBar(id, pct) {
  const el = $(id);
  el.style.width = Math.min(100, Math.max(0, pct)) + '%';
  el.style.background = pct >= 90 ? COLORS.bad : pct >= 75 ? COLORS.warn : 'var(--accent)';
}

function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? d + ' j ' : '') + h + ' h ' + m + ' min';
}

function fanEstimate(t) {
  if (t >= 65) return '100 %';
  if (t >= 60) return '55 %';
  if (t >= 55) return '30 %';
  return 'arrêté (< 55 °C)';
}

async function updateTemperature() {
  const chart = 'sensors.temperature_cpu_thermal-virtual-0_temp1_input';
  const [now, hist] = await Promise.all([
    latest(chart),
    query(chart, 'after=-1800&points=60&group=average')
  ]);
  const t = now.input;
  $('temp').innerHTML = t.toFixed(1) + ' <small>°C</small>';
  $('temp').style.color = t >= 65 ? COLORS.bad : t >= 55 ? COLORS.warn : COLORS.ok;
  $('fan').textContent = 'Ventilateur (estimé d\'après la courbe) : ' + fanEstimate(t);
  const vals = hist.data.slice().reverse().map(r => r[1]).filter(v => v != null);
  if (vals.length > 1) {
    const min = Math.min(...vals, 30), max = Math.max(...vals, 70);
    const pts = vals.map((v, i) =>
      (i / (vals.length - 1) * 200).toFixed(1) + ',' + (46 - (v - min) / (max - min) * 44).toFixed(1)
    ).join(' ');
    $('temp-spark').querySelector('polyline').setAttribute('points', pts);
  }
}

async function updateSystem() {
  const [cpu, load, ram, disk, up] = await Promise.all([
    latest('system.cpu'), latest('system.load'), latest('system.ram'),
    latest('disk_space./'), latest('system.uptime')
  ]);
  const cpuPct = sumValues(cpu);
  $('cpu').innerHTML = cpuPct.toFixed(0) + ' <small>%</small>';
  setBar('cpu-bar', cpuPct);
  $('load').textContent = 'Charge : ' + load.load1.toFixed(2) + ' · ' + load.load5.toFixed(2) + ' · ' + load.load15.toFixed(2) + ' (4 cœurs)';

  const ramTotal = sumValues(ram);
  const ramPct = ram.used / ramTotal * 100;
  $('ram').innerHTML = ramPct.toFixed(0) + ' <small>%</small>';
  setBar('ram-bar', ramPct);
  $('ram-detail').textContent = (ram.used / 1024).toFixed(2) + ' Go utilisés sur ' + (ramTotal / 1024).toFixed(1) + ' Go (cache : ' + (ram.cached / 1024).toFixed(1) + ' Go)';

  const diskTotal = sumValues(disk);
  const diskPct = disk.used / diskTotal * 100;
  $('disk').innerHTML = diskPct.toFixed(0) + ' <small>%</small>';
  setBar('disk-bar', diskPct);
  $('disk-detail').textContent = disk.used.toFixed(1) + ' Go utilisés · ' + disk.avail.toFixed(1) + ' Go libres';

  $('sub').textContent = 'Raspberry Pi 4 · uptime ' + fmtUptime(up.uptime);
}

async function loadNames() {
  const r = await fetch('/api/v1/charts', { cache: 'no-store' });
  const d = await r.json();
  names = Object.keys(d.charts)
    .map(k => (k.match(/^docker_local\.container_(.+)_state$/) || [])[1])
    .filter(Boolean)
    .sort();
}

async function loadMeta() {
  const r = await fetch('/containers.json', { cache: 'no-store' });
  if (!r.ok) throw new Error('containers.json ' + r.status);
  const list = await r.json();
  meta = {};
  list.forEach(c => { meta[c.name] = c; });
}

function stateOf(o) {
  let best = 'other', max = -1;
  Object.entries(o).forEach(([k, v]) => { if (k !== 'time' && v > max) { max = v; best = k; } });
  return best;
}

async function fetchLogsCtl() {
  try {
    const r = await fetch('/logs-control/state', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    logsCtl = await r.json();
  } catch (e) { logsCtl = null; }
  return logsCtl;
}

function fmtLeft(sec) {
  const m = Math.max(1, Math.round(sec / 60));
  return m >= 60 ? Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') : m + ' min';
}

function logsControlHtml() {
  const err = logsMsg ? '<span class="err">' + logsMsg + '</span>' : '';
  if (logsBusy) {
    return '<div class="ctl"><button disabled>' + (logsBusy === 'on' ? 'Démarrage…' : 'Arrêt…') + '</button>' +
      '<span class="muted">quelques secondes (le tunnel peut mettre ~10 s à répondre)</span></div>';
  }
  if (!logsCtl) return '<div class="ctl"><span class="muted">Contrôle indisponible (service logs-control arrêté ?).</span>' + err + '</div>';
  if (logsCtl.missing) {
    return '<div class="ctl"><span class="muted">Les conteneurs Dozzle n\'existent pas encore : les créer avec ' +
      '<code>docker compose --profile logs up --no-start dozzle cloudflared-logs</code>.</span></div>';
  }
  if (logsCtl.up) {
    const left = logsCtl.remaining_s === null ? '' : 'arrêt automatique dans ' + fmtLeft(logsCtl.remaining_s);
    return '<div class="ctl"><button data-logs="off">Arrêter Dozzle</button>' +
      '<a href="https://logs.maximelabatut.com" target="_blank" rel="noopener">Ouvrir les logs ↗</a>' +
      '<span class="muted">' + left + '</span>' + err + '</div>';
  }
  const hours = Math.round((logsCtl.max_minutes || 120) / 60);
  return '<div class="ctl"><button data-logs="on">Démarrer Dozzle</button>' +
    '<span class="muted">Arrêté (à la demande). Prêt en ~15 s, arrêt automatique après ' + hours + ' h.</span>' + err + '</div>';
}

document.addEventListener('click', async e => {
  const b = e.target && e.target.closest ? e.target.closest('button[data-logs]') : null;
  if (!b || logsBusy) return;
  const action = b.getAttribute('data-logs');
  logsBusy = action; logsMsg = '';
  updateContainers().catch(() => {});
  try {
    const r = await fetch('/logs-control/' + action, { method: 'POST', headers: { 'X-Logs-Control': '1' } });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || 'HTTP ' + r.status); }
    for (let i = 0; i < 20; i++) {              // attend l'état voulu, 40 s au maximum
      const st = await fetchLogsCtl();
      if (st && (action === 'on' ? st.up : !Object.values(st.services).some(v => v === 'running'))) break;
      await new Promise(res => setTimeout(res, 2000));
    }
  } catch (err) { logsMsg = 'Échec : ' + err.message; }
  logsBusy = '';
  await updateContainers().catch(() => {});
});

function rowHtml(r, onDemand) {
  const stopped = r.state === 'exited' || r.state === 'dead';
  const cls = r.state === 'running' ? 'running' : (onDemand && stopped) ? 'idle' : stopped ? 'exited' : 'other';
  const cpu = r.cpu === null ? '—' : r.cpu.toFixed(1) + ' %';
  const m = meta[r.name];
  const label = m && m.id && logsAvailable
    ? '<a class="log" href="' + DOZZLE + m.id + '" target="_blank" rel="noopener" title="Voir les logs dans Dozzle">' + r.name + '</a>'
    : (m && m.id ? '<span title="Dozzle est arrêté (service à la demande) : liens vers les logs désactivés">' + r.name + '</span>' : r.name);
  const desc = DESCRIPTIONS[r.name] || (m ? 'Image : ' + m.image : '');
  const [kindLabel, kindCls] = kindOf(r.name);
  return '<tr><td><span class="kind ' + kindCls + '">' + kindLabel + '</span></td><td>' + label + '</td><td class="desc">' + desc +
    '</td><td><span class="badge ' + cls + '">' + r.state + '</span></td><td>' + cpu + '</td></tr>';
}

function groupHtml(g) {
  const total = g.rows.length;
  const up = g.rows.filter(r => r.state === 'running').length;
  const demand = g.demandMembers ? g.rows.filter(r => g.demandMembers.includes(r.name)) : g.rows;
  const idle = g.onDemand && demand.every(r => r.state !== 'running');
  const cls = idle ? 'idle' : total && up === total ? 'ok' : up === 0 ? 'bad' : 'warn';
  const host = g.url ? g.url.replace('https://', '') : '';
  const access = g.url
    ? '<p class="muted access">Accès : <a href="' + g.url + '" target="_blank" rel="noopener">' + host + ' ↗</a></p>'
    : '';
  const note = g.note ? '<p class="muted" style="margin-top:6px">' + g.note + '</p>' : '';
  const cpuSum = g.rows.reduce((s, r) => s + (r.cpu || 0), 0);
  const link = g.url
    ? '<a href="' + g.url + '" target="_blank" rel="noopener" title="Ouvrir ' + host + '">' + host + ' ↗</a>'
    : '';
  return '<details class="app" data-id="' + g.id + '"' + (openApps.has(g.id) ? ' open' : '') + '>' +
    '<summary><span class="dot ' + cls + '"></span><span class="app-name">' + g.name + '</span>' +
    '<span class="app-url">' + link + '</span><span class="app-cpu" title="Somme du CPU des conteneurs du tiroir">CPU ' + cpuSum.toFixed(1) + ' %</span>' +
    '<span class="app-count ' + cls + '">' + (idle ? 'à la demande' : up + '/' + total + ' en ligne') + '</span></summary>' +
    '<div class="app-body">' + access + note + (g.control === 'logs' ? logsControlHtml() : '') +
    '<div class="scroll"><table><thead><tr><th></th><th>Conteneur</th><th>Rôle</th><th>État</th><th>CPU</th></tr></thead><tbody>' +
    g.rows.map(r => rowHtml(r, g.onDemand && (!g.demandMembers || g.demandMembers.includes(r.name)))).join('') + '</tbody></table></div></div></details>';
}

async function updateContainers() {
  if (!names.length) await loadNames();
  await fetchLogsCtl();
  await loadMeta().catch(() => {});
  const rows = await Promise.all(names.map(async name => {
    const [st, cpu] = await Promise.allSettled([
      latest('docker_local.container_' + name + '_state', 20),
      latest('cgroup_' + name + '.cpu')
    ]);
    return {
      name,
      state: st.status === 'fulfilled' ? stateOf(st.value) : 'inconnu',
      cpu: cpu.status === 'fulfilled' ? sumValues(cpu.value) : null
    };
  }));
  const byName = {};
  rows.forEach(r => { byName[r.name] = r; });
  logsAvailable = logsCtl ? logsCtl.up : ['dozzle', 'cloudflared-logs'].every(n => byName[n] && byName[n].state === 'running');
  const used = new Set();
  const groups = APPS.map(a => {
    a.members.forEach(n => used.add(n));
    return { ...a, rows: a.members.map(n => byName[n]).filter(Boolean) };
  });
  const others = rows.filter(r => !used.has(r.name));
  if (others.length) groups.push({ id: 'others', category: 'tech', name: 'Autres conteneurs', url: null, rows: others });
  $('apps-main').innerHTML = groups.filter(g => g.category === 'main').map(groupHtml).join('');
  $('apps-tech').innerHTML = groups.filter(g => g.category === 'tech').map(groupHtml).join('');
}

async function refresh() {
  if (document.hidden) return;
  const jobs = [updateTemperature(), updateSystem()];
  if (tick % 2 === 0) jobs.push(updateContainers());
  tick++;
  const results = await Promise.allSettled(jobs);
  const ok = results.every(r => r.status === 'fulfilled');
  const pill = $('status');
  pill.className = 'pill ' + (ok ? 'ok' : 'bad');
  pill.textContent = ok ? 'En ligne · ' + new Date().toLocaleTimeString('fr-FR') : 'Données indisponibles';
}

refresh();
setInterval(refresh, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick = 0; refresh(); } });
</script>
</body>
</html>
