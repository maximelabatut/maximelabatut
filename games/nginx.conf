server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le JS du jeu fait ~4 Mo : compressé, ~1,6 Mo.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    # Fichiers de build à nom haché (Vite) : jamais modifiés, cache d'un an.
    location ~* /assets/.+\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Musiques, images : un jour.
    location ~* \.(mp3|png|jpg|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
    }

    # Manettes téléphone de Garden Brawl : relais vers le conteneur gardenbrawl-manettes (page manette + WebSocket).
    # Le nom est résolu à la demande (variable + resolver Docker) : si le serveur de manettes est arrêté, seules ces
    # adresses répondent 502, nginx et le reste du site démarrent normalement.
    resolver 127.0.0.11 valid=10s;
    set $manettes http://gardenbrawl-manettes:8787;

    location ^~ /manette/ {
        rewrite ^/manette/(.*)$ /$1 break;
        proxy_pass $manettes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;     # les WebSocket restent ouverts toute la partie
    }

    # La page manette ouvre `/ws` sur son propre domaine (sans le préfixe /manette).
    location = /ws {
        proxy_pass $manettes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Pages HTML : toujours revalidées, pour qu'une mise à jour du jeu soit vue tout de suite.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
}
