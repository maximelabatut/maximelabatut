server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le JS du jeu fait ~4 Mo : compressé, ~1,6 Mo.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    # Fichiers de build à nom haché (Vite) : jamais modifiés, cache d'un an.
    location ~* /assets/.+\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Musiques, images : un jour.
    location ~* \.(mp3|png|jpg|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
    }

    # Pages HTML : toujours revalidées, pour qu'une mise à jour du jeu soit vue tout de suite.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
}
