jobs:
  - name: local
    address: 'unix:///var/run/docker.sock'
    # 60 s suffit (alarme « conteneur unhealthy » avec au plus 1 min de retard) ; à 10 s, ce collecteur faisait
    # consommer ~10 % d'un coeur à dockerd et à containerd (rafales toutes les 10 s, mesurées le 2026-10-09).
    update_every: 60
    collect_container_size: no
