[db]
    update every = 2

[plugins]
    apps = no
    # Extensions inutilisées par ce homelab, désactivées pour économiser RAM et CPU (mesures du 4 oct. 2026 : ~100 Mo de RSS,
    # et 1 268 erreurs/jour pour scripts.d qui surveille un dossier inexistant).
    # À CONSERVER activées : proc, cgroups, diskspace, go.d (collecteur Docker) et debugfs (c'est elle qui fournit la
    # température du CPU lue par le dashboard : graphique sensors.temperature_cpu_thermal-virtual-0_temp1_input).
    scripts.d = no
    otel = no
    netflow = no
    network-viewer = no
    systemd-journal = no
    systemd-units = no
    ioping = no
    perf = no
    charts.d = no
    python.d = no
    tc = no
    statsd = no

[ml]
    enabled = yes
