# Rotation des logs des conteneurs (sans elle, le pilote json-file grossit indéfiniment sur la carte SD) :
# 3 fichiers de 10 Mo maximum par conteneur.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  www:
    image: nginx
    container_name: www
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./www/html:/usr/share/nginx/html:ro

  www-status:
    image: curlimages/curl:latest
    container_name: www-status
    logging: *default-logging
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/sh", "/status.sh"]
    volumes:
      - ./www/status.sh:/status.sh:ro
      - ./www/html/data:/data

  gamevault:
    image: python:3.12-slim
    container_name: gamevault
    logging: *default-logging
    restart: unless-stopped
    working_dir: /app
    command: python rss_proxy_server.py
    environment:
      - GAMEVAULT_HOST=0.0.0.0
      - GAMEVAULT_DB=/data/catalog.db
    ports:
      - "127.0.0.1:8081:8787"
    volumes:
      - ./gamevault/app:/app:ro
      - ./gamevault/data:/data

  web2:
    image: nginx
    container_name: web2
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./web2/html:/usr/share/nginx/html:ro

  dashboard:
    image: nginx
    container_name: dashboard
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./dashboard/html:/usr/share/nginx/html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard/data:/data:ro

  dashboard-sync:
    image: docker:cli
    container_name: dashboard-sync
    logging: *default-logging
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/sync.sh"]
    volumes:
      - ./dashboard/sync.sh:/sync.sh:ro
      - ./dashboard/data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Démarre/arrête Dozzle et son tunnel à la demande (bouton du dashboard) ; arrêt automatique après 2 h.
  # Ne peut agir que sur ces deux conteneurs (noms en dur). Joint par le nginx du dashboard, uniquement sur 127.0.0.1.
  logs-control:
    image: python:3.12-slim
    container_name: logs-control
    logging: *default-logging
    restart: unless-stopped
    user: "65534:65534"
    group_add:
      - "${DOCKER_GID}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - LOGS_MAX_MINUTES=120
    entrypoint: ["python", "/app/control.py"]
    ports:
      - "127.0.0.1:8087:8090"
    volumes:
      - ./dashboard/logs-control/control.py:/app/control.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - PGID=${DOCKER_GID}
      - DO_NOT_TRACK=1
    volumes:
      - netdataconfig:/etc/netdata
      - ./netdata/netdata.conf:/etc/netdata/netdata.conf:ro
      - ./netdata/go.d/docker.conf:/etc/netdata/go.d/docker.conf:ro
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    logging: *default-logging
    profiles: ["logs"]   # à la demande : démarré par `pi/logs.sh on` ; absent de `docker compose up -d` (et arrêté par lui s'il tourne)
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uptime-kuma/data:/app/data

  homewatch:
    build: ./homewatch/app
    image: homewatch:local
    container_name: homewatch
    logging: *default-logging
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    ports:
      - "127.0.0.1:8086:5000"
    volumes:
      - ./homewatch/data:/data
    tmpfs:
      - /run/hls:uid=1000,gid=1000,size=256m
      - /tmp

  # JDownloader 2 (interface web noVNC). Exposé UNIQUEMENT sur 127.0.0.1 (aucun tunnel Cloudflare) : accès par
  # `ssh -L 5800:127.0.0.1:8088 maxime@maxime.local` puis http://localhost:5800. Les téléchargements vont sur le disque de stockage ;
  # si celui-ci n'est pas monté, le conteneur ne démarre pas (create_host_path: false) au lieu d'écrire sur la carte SD.
  # Java : tas limité à 640 Mo, conteneur à 1 Go.
  jdownloader:
    image: jlesage/jdownloader-2:latest
    container_name: jdownloader
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - USER_ID=1000
      - GROUP_ID=100
      - TZ=Europe/Paris
      - JDOWNLOADER_MAX_MEM=640M
      - DARK_MODE=1
      - KEEP_APP_RUNNING=1
    ports:
      - "127.0.0.1:8088:5800"
      - "9666:9666"   # Click'n'Load (bouton Télécharger de GameVault)
    volumes:
      - ./jdownloader/config:/config
      - type: bind
        source: /srv/stockage/telechargements
        target: /output
        bind:
          create_host_path: false

  cloudflared-www:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-www
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_WWW}

  cloudflared-gamevault:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-gamevault
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_GAMEVAULT}

  # Salle de jeux (games.maximelabatut.com) : page d'accueil + un dossier par jeu (statique, nginx).
  # Exposé uniquement sur 127.0.0.1 : on n'y accède que par le tunnel cloudflared-games.
  # /manette/ et /ws sont relayés vers gardenbrawl-manettes (manettes téléphone de Garden Brawl).
  games:
    image: nginx:alpine
    container_name: games
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:80"
    volumes:
      - ./games/html:/usr/share/nginx/html:ro
      - ./games/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gardenbrawl-manettes

  # Garden Brawl : serveur de manettes téléphone (Node + ws, en mémoire, aucun port publié : nginx le joint par son nom).
  gardenbrawl-manettes:
    build: ./games/manettes
    image: gardenbrawl-manettes:local
    container_name: gardenbrawl-manettes
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 128m
    read_only: true

  cloudflared-games:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-games
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_GAMES}

  # Menu Futé (application privée, dépôt maximelabatut/menufute) : catalogue de recettes + fiches imprimables.
  # Exposé uniquement sur 127.0.0.1 : accès par le tunnel cloudflared-menufute, derrière Cloudflare Access.
  # Sources copiées dans ./menufute/app par mac/mettre-a-jour-menufute.sh ; base SQLite dans ./menufute/data (hors git).
  menufute:
    build:
      context: ./menufute/app
      dockerfile: ../Dockerfile
    image: menufute:local
    container_name: menufute
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "127.0.0.1:8090:3000"
    volumes:
      - ./menufute/data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/sync/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  cloudflared-menufute:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-menufute
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_MENUFUTE}

  # Roborock Cleaner (application privée, dépôt maximelabatut/roborockcleaner) : pilote l'aspirateur via Matter.
  # network_mode: host OBLIGATOIRE : Matter découvre l'appareil par mDNS (multicast), absent d'un réseau Docker en pont.
  # L'application n'écoute que sur 127.0.0.1:8091 et ne demande PAS de jeton aux connexions locales (donc au tunnel) :
  # Cloudflare Access est la seule barrière, elle doit être en place AVANT de démarrer cloudflared-cleaner.
  # Sources copiées dans ./cleaner/app par mac/mettre-a-jour-cleaner.sh ; jumelage (secret) dans ./cleaner/matter-storage (hors git).
  # Ne démarre qu'après le jumelage (voir ajouter-un-site.md) : sans appareil jumelé le serveur s'arrête.
  cleaner:
    build:
      context: ./cleaner/app
      dockerfile: ../Dockerfile
    image: cleaner:local
    container_name: cleaner
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    mem_limit: 384m
    environment:
      - HOST=127.0.0.1
      - PORT=8091
    volumes:
      - ./cleaner/matter-storage:/app/.matter-storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  cloudflared-cleaner:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-cleaner
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_CLEANER}

  # Roborock Cleaner, plan de la maison (optionnel) : service Python sur 127.0.0.1:3001, relayé par `cleaner` (MAPPER_URL par défaut).
  # Demande une connexion au compte Roborock (voir ajouter-un-site.md) : `docker compose run --rm cleaner-mapper roborock login --email …`.
  # La session (secret) est dans ./cleaner/roborock-home (hors git, non sauvegardée).
  cleaner-mapper:
    build:
      context: ./cleaner/app
      dockerfile: ../Dockerfile.mapper
    image: cleaner-mapper:local
    container_name: cleaner-mapper
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    mem_limit: 256m
    environment:
      - MAPPER_PORT=3001
    volumes:
      - ./cleaner/roborock-home:/home/app
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 3001), 3).close()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  cloudflared-web2:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-web2
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_WEB2}

  cloudflared-config:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-config
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_CONFIG}

  cloudflared-logs:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-logs
    logging: *default-logging
    profiles: ["logs"]   # à la demande : démarré par `pi/logs.sh on` ; absent de `docker compose up -d` (et arrêté par lui s'il tourne)
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_LOGS}

  cloudflared-netdata:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-netdata
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_NETDATA}

  cloudflared-uptime:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-uptime
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_UPTIME}

  cloudflared-homewatch:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-homewatch
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_HOMEWATCH}

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
