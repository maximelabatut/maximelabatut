# Rotation des logs des conteneurs (sans elle, le pilote json-file grossit indéfiniment sur la carte SD) :
# 3 fichiers de 10 Mo maximum par conteneur.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  www:
    image: nginx
    container_name: www
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./www/html:/usr/share/nginx/html:ro

  www-status:
    image: curlimages/curl:latest
    container_name: www-status
    logging: *default-logging
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/sh", "/status.sh"]
    volumes:
      - ./www/status.sh:/status.sh:ro
      - ./www/html/data:/data

  gamevault:
    image: python:3.12-slim
    container_name: gamevault
    logging: *default-logging
    restart: unless-stopped
    working_dir: /app
    command: python rss_proxy_server.py
    environment:
      - GAMEVAULT_HOST=0.0.0.0
      - GAMEVAULT_DB=/data/catalog.db
    ports:
      - "127.0.0.1:8081:8787"
    volumes:
      - ./gamevault/app:/app:ro
      - ./gamevault/data:/data

  web2:
    image: nginx
    container_name: web2
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./web2/html:/usr/share/nginx/html:ro

  dashboard:
    image: nginx
    container_name: dashboard
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./dashboard/html:/usr/share/nginx/html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard/data:/data:ro

  dashboard-sync:
    image: docker:cli
    container_name: dashboard-sync
    logging: *default-logging
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/sync.sh"]
    volumes:
      - ./dashboard/sync.sh:/sync.sh:ro
      - ./dashboard/data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - PGID=${DOCKER_GID}
      - DO_NOT_TRACK=1
    volumes:
      - netdataconfig:/etc/netdata
      - ./netdata/netdata.conf:/etc/netdata/netdata.conf:ro
      - ./netdata/go.d/docker.conf:/etc/netdata/go.d/docker.conf:ro
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    logging: *default-logging
    profiles: ["logs"]   # à la demande : démarré par `pi/logs.sh on` ; absent de `docker compose up -d` (et arrêté par lui s'il tourne)
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uptime-kuma/data:/app/data

  homewatch:
    build: ./homewatch/app
    image: homewatch:local
    container_name: homewatch
    logging: *default-logging
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    ports:
      - "127.0.0.1:8086:5000"
    volumes:
      - ./homewatch/data:/data
    tmpfs:
      - /run/hls:uid=1000,gid=1000,size=256m
      - /tmp

  cloudflared-www:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-www
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_WWW}

  cloudflared-gamevault:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-gamevault
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_GAMEVAULT}

  cloudflared-web2:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-web2
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_WEB2}

  cloudflared-config:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-config
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_CONFIG}

  cloudflared-logs:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-logs
    logging: *default-logging
    profiles: ["logs"]   # à la demande : démarré par `pi/logs.sh on` ; absent de `docker compose up -d` (et arrêté par lui s'il tourne)
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_LOGS}

  cloudflared-netdata:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-netdata
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_NETDATA}

  cloudflared-uptime:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-uptime
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_UPTIME}

  cloudflared-homewatch:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-homewatch
    logging: *default-logging
    restart: unless-stopped
    network_mode: host
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN_HOMEWATCH}

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
