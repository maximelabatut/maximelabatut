<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maxime Labatut</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --text: #e8e8ea;
    --muted: #8a8f98;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  header {
    text-align: center;
    margin-bottom: 48px;
  }
  h1 {
    font-size: 2.2rem;
    font-weight: 600;
  }
  header p {
    color: var(--muted);
    margin-top: 8px;
    font-size: 1rem;
  }
  .services {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 700px;
  }
  a.card {
    background: var(--card);
    border: 1px solid #2a2d35;
    border-radius: 12px;
    padding: 24px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.2s, transform 0.2s;
  }
  a.card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  a.card h2 {
    font-size: 1.1rem;
    margin-bottom: 6px;
  }
  a.card p {
    color: var(--muted);
    font-size: 0.9rem;
  }
  footer {
    margin-top: 48px;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <header>
    <h1>Maxime Labatut</h1>
    <p>Serveur personnel auto-hébergé sur Raspberry Pi</p>
  </header>
  <div class="services">
    <a class="card" href="https://gamevault.maximelabatut.com">
      <h2>GameVault →</h2>
      <p>gamevault.maximelabatut.com</p>
    </a>
    <a class="card" href="https://web2.maximelabatut.com">
      <h2>Web2 →</h2>
      <p>web2.maximelabatut.com</p>
    </a>
  </div>
  <footer>Propulsé par Docker + Cloudflare Tunnel</footer>
</body>
</html>
